name: Release image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
            NEXT_PUBLIC_SITE_URL=https://learn.vdmitriev.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke test the pushed image
        run: |
          docker run -d --name learn -p 3141:3000 -e NEXT_PUBLIC_SITE_URL=https://learn.vdmitriev.com "${IMAGE}@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3141/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3141/api/health
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3141/en
          docker logs learn | tail -20
          docker rm -f learn
