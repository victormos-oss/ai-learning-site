# Mapping "upstream file -> lesson" for shareAI-lab/learn-claude-code.
# from:   README path relative to the clone root (must satisfy include/exclude in sources.yaml)
# module: lesson module folder under content/tracks/<track>/modules/
# order:  position inside the module; lesson folder becomes <NN>-<slug>
# code / assets: relative to the section folder (dirname of `from`)
# estimatedMinutes: ~1 minute per 180 words of README, rounded up to 5

