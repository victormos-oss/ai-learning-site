# learn.vdmitriev.com on VPS2. Copy into the nginx sites folder that is bind-mounted
# read-only into the nginx container, then restart that container (no reload).
# TLS: certbot certificates on the host (see docs/deploy.md).

upstream learn_app {
    server 127.0.0.1:3141;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name learn.vdmitriev.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name learn.vdmitriev.com;

    ssl_certificate     /etc/letsencrypt/live/learn.vdmitriev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.vdmitriev.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    # Static assets are content-hashed: cache for a year.
    location /_next/static/ {
        proxy_pass http://learn_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        limit_req zone=learn_api burst=20 nodelay;
        proxy_pass http://learn_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://learn_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# Put this in the http {} context (conf.d) once:
# limit_req_zone $binary_remote_addr zone=learn_api:1m rate=10r/s;
