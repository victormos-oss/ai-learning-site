# learn.vdmitriev.com on VPS2.
#
# nginx on VPS2 is the container dion-disk-nginx-1; its single config file
# /opt/dion-disk/nginx.conf is bind-mounted read-only, so this block is appended
# to that file (same inode, never mv) and the container is restarted, not reloaded.
# The container reaches host services through host.docker.internal (172.17.0.1),
# which is why compose publishes the app on APP_BIND=172.17.0.1.
# ACME webroot: /opt/dion-disk/acme on the host = /var/www/acme in the container.
#
#   certbot certonly --webroot -w /opt/dion-disk/acme -d learn.vdmitriev.com

# === LEARN 80 ===
server {
    listen 80;
    listen [::]:80;
    server_name learn.vdmitriev.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://learn.vdmitriev.com$request_uri;
    }
}
# === /LEARN 80 ===
# === LEARN 443 ===
limit_req_zone $binary_remote_addr zone=learn_api:1m rate=10r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name learn.vdmitriev.com;

    ssl_certificate     /etc/letsencrypt/live/learn.vdmitriev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.vdmitriev.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;

    # Static assets are content-hashed: cache for a year.
    location /_next/static/ {
        proxy_pass http://host.docker.internal:3141;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        limit_req zone=learn_api burst=20 nodelay;
        proxy_pass http://host.docker.internal:3141;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://host.docker.internal:3141;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
# === /LEARN 443 ===
